  if (c[pl] === false) return false;
  if (isEvent) {
    if (!c.events) return false;
    const k = m.kind; if (k === 'follow' && !c.evFollow) return false; if (k === 'sub' && !c.evSub) return false; if (k === 'gift' && !c.evGift) return false;
    if (!['follow', 'sub', 'gift'].includes(k) && !c.evOther) return false;
    return true;
  }
  const t = String(m.text || '');
  if (c.hideCommands && /^\s*!/.test(t)) return false;
  if (c.minLen > 0 && t.trim().length < c.minLen) return false;
  if (list(c.hideUsers).includes(String(m.user || '').toLowerCase())) return false;
  const low = t.toLowerCase(); if (list(c.hideWords).some(w => low.includes(w))) return false;
  if (c.links === 'hide' && /https?:\/\/|www\./i.test(t)) return false;
  return true;
}
function buildChat(m) {
  if (!allowed(m, false)) return null;
  let text = String(m.text || '');
  if (cfg.links === 'strip') text = text.replace(/https?:\/\/\S+|www\.\S+/gi, '').replace(/\s{2,}/g, ' ').trim();
  if (!text) return null;
  const plain = !cfg.showEmotes;
  if (cfg.maxLen > 0 && plain && text.length > cfg.maxLen) text = text.slice(0, cfg.maxLen).trimEnd() + '…';
  const d = el('div', 'm p-' + m.platform + (cfg.nameOwnLine ? ' own' : '') + (cfg.stripe ? ' stripe' : ''));
  d.style.setProperty('--pc', PCOL[m.platform] || '#888');
  if (cfg.showTime) d.append(stampEl(m));
  if (cfg.showPlatform && ICONS[m.platform]) d.append(icon(m.platform, 'pi'));
  d.append(nameEl(m, 72), el('span', 'c', cfg.showColon ? (cfg.separator || ':') : ''));
  const hw = list(cfg.hlWords);
  if (hw.length && hw.some(w => text.toLowerCase().includes(w))) { if (cfg.hlMode !== 'text') d.classList.add('hl-card'); if (cfg.hlMode !== 'card') d.classList.add('hl-text'); }   // слова-тригери: виділення фоном і/або кольором тексту
  const body = el('span', 't');
  if (plain) body.textContent = m.platform === 'kick' ? plainKick(text) : text;
  else {
    if (cfg.maxLen > 0 && text.length > cfg.maxLen && !/\[emote:/.test(text) && !(m.emotes && m.emotes.length)) text = text.slice(0, cfg.maxLen).trimEnd() + '…';   // у повідомленнях зі смайлами не ріжемо, щоб не зламати позиції
    if (m.platform === 'kick') appendKickEmotes(body, text);
    else if (m.platform === 'twitch') appendTwitchEmotes(body, text, m.emotes);
    else if (m.platform === 'youtube' && Array.isArray(m.emotes) && m.emotes.length) appendYouTubeEmotes(body, text, m.emotes);
    else if (m.platform === 'tiktok' && Array.isArray(m.emotes) && m.emotes.length) appendTikTokEmotes(body, text, m.emotes);
    else body.textContent = text;
  }
  d.append(body);
  return d;
}
function buildEvt(m) {
  if (!allowed(m, true)) return null;
  const d = el('div', 'm evt ev-' + cfg.eventStyle + ' p-' + m.platform + (cfg.nameOwnLine ? ' own' : ''));
  if (cfg.showTime) d.append(stampEl(m));
  if (cfg.showPlatform && ICONS[m.platform]) d.append(icon(m.platform, 'pi'));
  if (cfg.eventIcon) d.append(evIcon(m.kind));
  d.append(nameEl(m, 78), el('span', 'c', ''));
  if (m.image && m.platform === 'tiktok' && /^https:\/\/(?:[\w-]+\.)*tiktokcdn\.com\//i.test(m.image)) {
    const img = el('img', 'tiktok-gift'); img.src = m.image; img.alt = 'Подарунок TikTok'; img.referrerPolicy = 'no-referrer'; img.onerror = () => img.remove(); d.append(img);
  }
  d.append(el('span', 't', ' ' + (m.text || '')));
  return d;
}
const addChat = (m, t) => add('c', m, t), addEvt = (m, t) => add('e', m, t);
/* ---- зразки повідомлень (перегляд у вікні налаштувань і кнопка «Тест у OBS») ---- */
const SAMPLES = [
  { type: 'chat', platform: 'twitch', user: 'imakcoc', text: 'Привіт, чат! Як справи?' },
  { type: 'chat', platform: 'youtube', user: 'Оленка', text: 'Дуже цікавий стрім, дякую!' },
  { type: 'chat', platform: 'tiktok', user: 'dasha_live', text: 'Підписалась, чекаю розіграш' },
  { type: 'chat', platform: 'kick', user: 'Andriy77', text: 'Це довге повідомлення, щоб було видно перенесення рядка у віджеті чату в OBS і відступи' },
  { type: 'event', platform: 'twitch', kind: 'follow', user: 'Новий_Глядач', text: 'тепер стежить за каналом' },
  { type: 'chat', platform: 'twitch', user: 'Markiyan', text: 'GG, дуже круто 🔥' },
  { type: 'event', platform: 'tiktok', kind: 'gift', user: 'Sofiia', text: 'подарувала Rose x5' },
  { type: 'chat', platform: 'youtube', user: 'Тарас', text: '!команда (її можна сховати)' },
];
let sampleN = 0;
function playSamples(count, step, test) {
  for (let i = 0; i < count; i++) setTimeout(() => { const m = { ...SAMPLES[sampleN++ % SAMPLES.length], ts: Date.now() }; (m.type === 'event' ? addEvt : addChat)(m, test); }, i * step);
}
let testTimer = null, pendingTest = null;
function startTest() {   // безперервний тест: зразки з'являються, доки його не зупинять кнопкою «Зупинити тест»
  if (testTimer) return;
  playSamples(4, 350, true);
  testTimer = setInterval(() => playSamples(1, 0, true), 1700);
}
function stopTest() {
  clearInterval(testTimer); testTimer = null;
  for (let i = items.length - 1; i >= 0; i--) if (items[i].test) items.splice(i, 1);
  if (cfg) rerender();
}
function onTest(m) { if (m.on === false) stopTest(); else startTest(); }
function onMsg(m) {
  if (!m || typeof m !== 'object') return;
  if (m.type === 'chat') addChat(m);
  else if (m.type === 'event') addEvt(m);
  else if (m.type === 'twitchEmotes') setTwitchExtra(m.emotes);
  else if (m.type === 'chatWidget' && m.cfg) { if (!m.id || m.id === myId) applyCfg(m.cfg); }
  else if (m.type === 'cwTest') { if (!myId) pendingTest = m; else if (!m.id || m.id === myId) onTest(m); }
  else if (m.type === 'cmd' && m.cmd === 'clearfeed') { items.length = 0; feed.replaceChildren(); }
}
if (PREVIEW) {
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'cfg') applyCfg(e.data.cfg);
    else if (e.data.type === 'play') { items.length = 0; feed.replaceChildren(); playSamples(e.data.count || 6, 350); }
  });
  fetch('/api/chat-widget?p=' + encodeURIComponent(PROFILE)).then(r => r.json()).then(j => { if (j && j.cfg) { myId = j.id || ''; applyCfg(j.cfg); } try { parent.postMessage({ type: 'cwReady' }, location.origin); } catch {} }).catch(() => {});
} else {
  fetch('/api/chat-widget?p=' + encodeURIComponent(PROFILE)).then(r => r.json()).then(j => { if (j && j.cfg) { myId = j.id || ''; applyCfg(j.cfg); if (pendingTest && (!pendingTest.id || pendingTest.id === myId)) onTest(pendingTest); pendingTest = null; } }).catch(() => {});
  (function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch {} };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => { try { ws.close(); } catch {} };
  })();
}
})();
